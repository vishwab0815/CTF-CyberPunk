name: MongoDB Keep-Alive

on:
  schedule:
    # Runs every 12 hours — adjust as needed
    - cron: '0 */12 * * *'
  workflow_dispatch: {}

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies (pnpm)
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Run MongoDB keep-alive script
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: pnpm -s tsx scripts/db-keepalive.ts
